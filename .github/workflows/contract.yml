name: API contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto
      - run: python -m json.tool schemas/config-v1.schema.json >/dev/null
      - run: npx --yes @redocly/cli@1.34.5 lint openapi/observation-v1.yaml
      - name: Reject private defaults and credentials
        run: |
          ! git grep -nE '(networking\.re8ch\.com|registry\.re8ch\.com|CF_API_TOKEN|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- .
